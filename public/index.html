<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cowpoke Studios</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top-nav">
  <div class="nav-left">
    <img src="images/cow-logo.png" class="logo" alt="Cowpoke Studios Logo" />
    <nav>
      <button class="nav-btn" onclick="showSection('home')">HOME</button>
      <button class="nav-btn" onclick="showSection('movies')">MOVIES</button>
      <button class="nav-btn" onclick="showSection('trailers')">TRAILERS</button>
      <button class="nav-btn" onclick="showSection('store')">STORE</button>
    </nav>
  </div>
</header>

<main>

  <!-- HOME -->
  <section id="home" class="page active">
    <div id="hero">
      <div class="hero-overlay"></div>
      <h1 id="hero-title">FEATURED PROJECT</h1>
    </div>

    <section class="section">
      <h2>Latest</h2>
      <div class="row" id="latest-row"></div>
    </section>
  </section>

  <!-- MOVIES -->
  <section id="movies" class="page">
    <section class="section">
      <h1>Movies</h1>
      <div class="row" id="movies-row"></div>
    </section>
  </section>

  <!-- TRAILERS -->
  <section id="trailers" class="page">
    <section class="section">
      <h1>Trailers</h1>
      <div class="row" id="trailers-row"></div>
    </section>
  </section>

  <!-- STORE -->
  <section id="store" class="page">
    <section class="section">
      <h1>Store</h1>
      <p>Coming soon.</p>
    </section>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
